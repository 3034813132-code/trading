<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>交易分析仪表盘</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        :root { --bg-dark: #0d1117; --card-bg: #161b22; --border-color: #30363d; --text-main: #f0f6fc; --text-muted: #8b949e; --green: #2ea043; --red: #f85149; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--bg-dark); color: var(--text-main); font-family: -apple-system, sans-serif; padding: 12px; }
        .dashboard-container { max-width: 1200px; margin: 0 auto; }

        .header-top { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); padding: 15px 20px; border-radius: 12px; border: 1px solid var(--border-color); flex-wrap: wrap; gap: 12px; margin-bottom: 20px; }
        .greeting { font-size: 1.2rem; font-weight: 600; }
        #csvInput { display: none; }
        .btn { background: #21262d; border: 1px solid var(--border-color); padding: 8px 16px; border-radius: 6px; color: #fff; cursor: pointer; transition: 0.2s; }
        .btn-primary { background: #238636; border-color: #2ea043; }
        .btn-outline { background: transparent; }
        .btn-outline:hover { background: #21262d; }

        .controls-area { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 0 12px 0; border-bottom: 1px solid var(--border-color); margin-bottom: 20px; }
        .controls-area input { background: #0d1117; border: 1px solid var(--border-color); padding: 6px 10px; border-radius: 4px; color: #fff; width: 90px; }

        /* 数据卡片 (已去除英文) */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 25px; }
        .stat-card { background: var(--card-bg); border-radius: 8px; padding: 16px; border: 1px solid var(--border-color); position: relative; }
        .stat-card .label { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 6px; font-weight: 500; }
        .stat-card .value { font-size: 1.6rem; font-weight: 700; }
        .stat-card .sub { font-size: 0.8rem; color: var(--text-muted); margin-top: 4px; }
        .stat-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; border-top-left-radius: 8px; border-bottom-left-radius: 8px; }
        .border-green::before { background: var(--green); }
        .border-red::before { background: var(--red); }
        .border-neutral::before { background: var(--text-muted); }
        .text-green { color: var(--green) !important; }
        .text-red { color: var(--red) !important; }

        /* 图表区 */
        .chart-container { position: relative; background: var(--card-bg); border-radius: 8px; border: 1px solid var(--border-color); padding: 20px; margin-bottom: 20px; transition: all 0.2s ease; }
        .chart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; position: relative; }
        .chart-header h3 { font-size: 1.1rem; font-weight: 600; }
        .expand-btn { position: absolute; right: 0; top: -5px; background: transparent; border: 1px solid var(--border-color); color: var(--text-muted); padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; transition: 0.2s; }
        .expand-btn:hover { background: #30363d; color: #fff; }
        .chart-container.fullscreen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 9999; background: var(--bg-dark); margin: 0; padding: 20px; border-radius: 0; border: none; display: flex; flex-direction: column; }
        #equityChart { width: 100%; height: 350px; }
        .chart-container.fullscreen #equityChart { flex: 1; height: auto; }

        .chart-inner-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
        .stat-mini { display: flex; flex-direction: column; }
        .stat-mini .label { color: var(--text-muted); font-size: 0.8rem; margin-bottom: 4px; }
        .stat-mini .val { font-size: 1.2rem; font-weight: 700; }

        .chart-footer { display: flex; justify-content: space-between; margin-top: 15px; border-top: 1px solid var(--border-color); padding-top: 15px; color: var(--text-muted); font-size: 0.9rem; }

        /* 交易日历区 */
        .calendar-wrapper { background: var(--card-bg); border-radius: 8px; border: 1px solid var(--border-color); padding: 20px; margin-bottom: 25px; }
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        .calendar-nav { display: flex; align-items: center; gap: 15px; }
        .calendar-nav button { background: #21262d; border: 1px solid var(--border-color); color: #fff; border-radius: 4px; padding: 4px 10px; cursor: pointer; }
        .calendar-nav button:hover { background: #30363d; }
        .calendar-nav .month-title { font-size: 1.1rem; font-weight: 600; min-width: 100px; text-align: center; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; } /* 间距极限压缩 */
        .cal-weekday { color: var(--text-muted); font-size: 0.6rem; text-align: center; margin-bottom: 4px; }
        .cal-cell { background: #0d1117; border-radius: 4px; padding: 2px 1px; min-height: 28px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; border: 1px solid #21262d; position: relative; overflow: hidden; }
        .cal-cell .day { font-size: 0.5rem; color: var(--text-muted); margin-top: 2px; }
        .cal-cell.green { background: rgba(46, 160, 67, 0.2); border-color: var(--green); }
        .cal-cell.red { background: rgba(248, 81, 73, 0.2); border-color: var(--red); }
        .cal-cell.empty { background: transparent; border-color: transparent; }

        /* 金额右上角单位 */
        .cal-cell .amount-wrap { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; position: relative; }
        .cal-cell .currency { position: absolute; top: -2px; right: 1px; font-size: 0.35rem; opacity: 0.8; color: inherit; }
        .cal-cell .number { font-size: 0.55rem; font-weight: 600; white-space: nowrap; }
        .cal-cell .empty-sign { font-size: 0.4rem; color: var(--text-muted); }

        /* ================================================ */
        /* 【核心修复】手机端极限适配 */
        /* ================================================ */
        @media (max-width: 600px) {
            body { padding: 8px; }
            .greeting { font-size: 1rem; }
            .header-top, .controls-area, .stats-grid { flex-direction: column; align-items: stretch; text-align: center; }
            .controls-area { gap: 8px; }
            
            /* 卡片布局 */
            .stats-grid { grid-template-columns: 1fr 1fr; gap: 6px; }
            .stat-card { padding: 10px; }
            .stat-card .value { font-size: 1.2rem; }
            
            .chart-header h3 { font-size: 1rem; }
            
            .chart-inner-stats { grid-template-columns: 1fr 1fr 1fr; gap: 4px; }
            .stat-mini .label { font-size: 0.6rem; }
            .stat-mini .val { font-size: 1rem; }

            /* 日历极限压缩 */
            .calendar-grid { gap: 1px; }
            .cal-cell { min-height: 26px; padding: 1px 0px; border-radius: 2px; }
            .cal-cell .day { font-size: 0.4rem; margin-top: 1px; }
            .cal-cell .number { font-size: 0.45rem; }
            .cal-cell .currency { font-size: 0.3rem; top: -1px; right: 0px; }
            .cal-weekday { font-size: 0.4rem; }
            .chart-footer { font-size: 0.75rem; }
            
            #equityChart { height: 180px; }
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <div class="header-top">
            <div class="greeting">📈 交易分析面板 <span style="font-size:0.8rem;color:var(--text-muted);font-weight:normal;">自动读取</span></div>
            <button class="btn btn-outline" onclick="document.getElementById('csvInput').click()">📂 重新导入</button>
            <input type="file" id="csvInput" accept=".csv" onchange="handleFileSelect(event)">
        </div>

        <div class="controls-area">
            <label for="initCapital">初始资金 ($) :</label>
            <input type="number" id="initCapital" value="10000">
            <button class="btn btn-primary" onclick="applySettingsAndRender()">🔄 应用重绘</button>
        </div>

        <!-- 数据卡片 (纯中文) -->
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card border-green">
                <div class="label">总盈亏</div>
                <div class="value text-green" id="card_totalPL">+$0.00</div>
                <div class="sub" id="card_balance">当前资金: $0.00</div>
            </div>
            <div class="stat-card border-red">
                <div class="label">胜率</div>
                <div class="value text-red" id="card_winRate">0%</div>
                <div class="sub" id="card_winLose">0盈 / 0亏</div>
            </div>
            <div class="stat-card border-neutral">
                <div class="label">总交易</div>
                <div class="value" id="card_totalTrades">0</div>
                <div class="sub" id="card_days">共 0 笔</div>
            </div>
            <div class="stat-card border-green">
                <div class="label">盈利因子</div>
                <div class="value text-green" id="card_profitFactor">0.00x</div>
                <div class="sub" id="card_perTrade">平均盈亏 $0.00</div>
            </div>
            <div class="stat-card border-green">
                <div class="label">盈亏比</div>
                <div class="value text-green" id="card_riskReward">0:1</div>
                <div class="sub">平均盈利 / 亏损</div>
            </div>
            <div class="stat-card border-green">
                <div class="label">夏普比率</div>
                <div class="value text-green" id="card_sharpe">0.00</div>
                <div class="sub">年化调整收益</div>
            </div>
        </div>

        <!-- 图表区 -->
        <div class="chart-container" id="chartContainer">
            <div class="chart-header">
                <div>
                    <h3>资金曲线</h3>
                    <div style="color: var(--text-muted); font-size: 0.7rem; margin-top: 4px;">单绿平滑线 + 面积渐变</div>
                </div>
                <button class="expand-btn" id="fullscreenToggle" onclick="toggleFullScreen()">⛶ 全屏</button>
            </div>
            
            <div class="chart-inner-stats">
                <div class="stat-mini">
                    <span class="label">净值</span>
                    <span class="val text-green" id="stat_net">+$0.00</span>
                </div>
                <div class="stat-mini">
                    <span class="label">峰值</span>
                    <span class="val text-green" id="stat_peak">$0.00</span>
                </div>
                <div class="stat-mini">
                    <span class="label">最大回撤</span>
                    <span class="val text-red" id="stat_dip">$0.00</span>
                </div>
            </div>

            <div id="equityChart"></div>
            
            <div class="chart-footer">
                <div>统计时间 <br> <span id="chart_period" style="color:var(--text-main); font-weight: bold;">等待导入...</span></div>
                <div style="text-align: right;">总笔数 <br> <span id="chart_trades" style="color:var(--text-main); font-weight: bold;">0</span></div>
            </div>
        </div>

        <!-- 日历区 -->
        <div class="calendar-wrapper">
            <div class="calendar-header">
                <h3>交易日历</h3>
                <div class="calendar-nav">
                    <button onclick="changeMonth(-1)">《</button>
                    <span class="month-title" id="calendarMonthTitle">--年 --月</span>
                    <button onclick="changeMonth(1)">》</button>
                </div>
            </div>
            <div id="calendarGridContainer" style="min-height: 80px; display:flex; justify-content:center; align-items:center; color:var(--text-muted);">等待数据...</div>
        </div>
    </div>

    <script>
        let myChart = echarts.init(document.getElementById('equityChart'), 'dark');
        let globalRawRows = [];
        let globalDailyPLMap = {};
        let currentCalendarDate = new Date();

        myChart.setOption({
            grid: { top: 25, bottom: 25, left: 40, right: 20 },
            xAxis: { 
                type: 'category',
                axisLabel: { color: '#8b949e', interval: (index, value) => { if(index === 0) return true; return value !== myChart.getModel().get('xAxis')[0].data[index - 1]; } },
                splitLine: { show: false }
            },
            yAxis: { type: 'value', min: 0, splitLine: { lineStyle: { color: 'rgba(255,255,255,0.05)' } }, axisLabel: { color: '#8b949e' } },
            legend: { show: false },
            tooltip: {
                trigger: 'axis', backgroundColor: 'rgba(22,27,34,0.95)', borderColor: '#30363d', textStyle: { color: '#f0f6fc' },
                formatter: (p) => {
                    let d = new Date(p[0].data[0]); let t = `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
                    return `<div style="font-weight:bold;margin-bottom:4px;">${t}</div><div style="display:flex;justify-content:space-between;width:130px;"><span>当前资金</span><span style="color:#2ea043;font-weight:bold;">$${p[0].data[1].toFixed(2)}</span></div>`;
                }
            }
        });

        window.onload = function() {
            fetch('data.csv')
                .then(r => { if(!r.ok) throw new Error("未找到 data.csv"); return r.text(); })
                .then(t => { Papa.parse(t, { header: true, skipEmptyLines: true, complete: (r) => { globalRawRows = r.data; applySettingsAndRender(); } }); })
                .catch(e => console.log("⚠️ " + e.message));
        };

        function handleFileSelect(e) {
            const f = e.target.files[0]; if(!f) return;
            const r = new FileReader();
            r.onload = (ev) => { Papa.parse(ev.target.result, { header: true, skipEmptyLines: true, complete: (res) => { globalRawRows = res.data; applySettingsAndRender(); } }); };
            r.readAsText(f);
        }

        function applySettingsAndRender() {
            if(globalRawRows.length === 0) return;
            const initialCap = parseFloat(document.getElementById('initCapital').value) || 10000;
            const colDate = globalRawRows[0]?.DT ? 'DT' : 'Date';
            const colPL = globalRawRows[0]?.ProfitLoss ? 'ProfitLoss' : 'P&L';
            if(!colDate || !colPL) { alert("未找到日期或盈亏列"); return; }

            let totalPL=0, wins=0, losses=0, tWins=0, tLosses=0;
            let curBal=initialCap, maxBal=initialCap, maxProf=0, minDraw=0;
            let xDat=[], yDat=[], dailyPL={};
            let mD=null, xD=null;

            globalRawRows.filter(r => r[colDate] && r[colPL] !== '').sort((a,b) => new Date(a[colDate]) - new Date(b[colDate])).forEach(row => {
                const pl = parseFloat(row[colPL]); if(isNaN(pl)) return;
                totalPL+=pl; curBal+=pl;
                if(pl>0) {wins++; tWins+=pl;} else {losses++; tLosses+=Math.abs(pl);}
                if(curBal>maxBal) maxBal=curBal;
                let draw = curBal - maxBal; if(draw<minDraw) minDraw=draw;
                let prof = curBal - initialCap; if(prof>maxProf) maxProf=prof;
                const d = new Date(row[colDate]); if(!mD) mD=d; xD=d;
                xDat.push(`${d.getMonth()+1}/${d.getDate()}`); yDat.push(curBal);
                const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
                if(!dailyPL[key]) dailyPL[key]=0; dailyPL[key]+=pl;
            });

            const total = wins+losses, winRate = total>0 ? (wins/total*100) : 0;
            const pFactor = tLosses!==0 ? (tWins/tLosses) : (totalPL>0?999:0);
            const avgW = wins>0 ? (tWins/wins) : 0, avgL = losses>0 ? (tLosses/losses) : 1;
            const rReward = avgW/avgL;
            const dRet = Object.values(dailyPL); let sRatio=0;
            if(dRet.length>1) {
                const avg = dRet.reduce((a,b)=>a+b,0)/dRet.length;
                const var_ = dRet.reduce((a,b)=>a+Math.pow(b-avg,2),0)/dRet.length;
                const std = Math.sqrt(var_);
                if(std!==0) sRatio = (avg/std)*Math.sqrt(252);
            }

            document.getElementById('card_totalPL').innerText = (totalPL>=0?'+':'')+totalPL.toFixed(2);
            document.getElementById('card_balance').innerText = `当前资金: $${curBal.toFixed(2)}`;
            document.getElementById('card_winRate').innerText = winRate.toFixed(1)+'%';
            document.getElementById('card_winLose').innerText = `${wins}盈 / ${losses}亏`;
            document.getElementById('card_totalTrades').innerText = total;
            document.getElementById('card_days').innerText = `共 ${total} 笔`;
            document.getElementById('card_profitFactor').innerText = pFactor.toFixed(2)+'x';
            document.getElementById('card_perTrade').innerText = `平均盈亏 $${total>0?(totalPL/total).toFixed(2):'0.00'}`;
            document.getElementById('card_riskReward').innerText = rReward.toFixed(2)+':1';
            document.getElementById('card_sharpe').innerText = sRatio.toFixed(2);
            document.getElementById('stat_net').innerText = totalPL>=0 ? `+${totalPL.toFixed(2)}` : `${totalPL.toFixed(2)}`;
            document.getElementById('stat_peak').innerText = `$${maxProf.toFixed(2)}`;
            document.getElementById('stat_dip').innerText = `$${minDraw.toFixed(2)}`;
            document.getElementById('chart_trades').innerText = total;
            if(mD) document.getElementById('chart_period').innerText = `${mD.getMonth()+1}/${mD.getDate()} – ${xD.getMonth()+1}/${xD.getDate()}`;

            myChart.setOption({ xAxis: { data: xDat }, series: [{
                type:'line', smooth:0.4, symbol:'none', lineStyle:{ width:2.5, color:'#2ea043' },
                areaStyle:{ color: new echarts.graphic.LinearGradient(0,0,0,1, [{offset:0,color:'rgba(46,160,67,0.5)'},{offset:1,color:'rgba(46,160,67,0)'}]) },
                data: yDat, markLine: { symbol:['none','none'], label: { formatter: `初始资金 $${initialCap}`, position:'insideEndTop', color:'#fff' }, data: [{ yAxis: initialCap }], lineStyle: { color:'#f0f6fc', type:'dashed', width:1.5 } }
            }] });

            globalDailyPLMap = dailyPL;
            currentCalendarDate = new Date(Object.keys(globalDailyPLMap).sort()[0]);
            renderCalendar(currentCalendarDate);
        }

        function toggleFullScreen() {
            const c = document.getElementById('chartContainer'), b = document.getElementById('fullscreenToggle');
            c.classList.toggle('fullscreen');
            b.innerText = c.classList.contains('fullscreen') ? '✕ 退出' : '⛶ 全屏';
            setTimeout(()=>myChart.resize(), 200);
        }

        function renderCalendar(dObj) {
            const y = dObj.getFullYear(), m = dObj.getMonth();
            const mNames = ["一月","二月","三月","四月","五月","六月","七月","八月","九月","十月","十一月","十二月"];
            document.getElementById('calendarMonthTitle').innerText = `${y}年 ${mNames[m]}`;
            let html = `<div class="calendar-grid">`;
            let offset = new Date(y,m,1).getDay()-1; if(offset<0) offset=6;
            ['周一','周二','周三','周四','周五','周六','周日'].forEach(w => html += `<div class="cal-weekday">${w}</div>`);
            for(let i=0;i<offset;i++) html += `<div class="cal-cell empty"><div class="day">&nbsp;</div></div>`;
            for(let d=1; d<=new Date(y,m+1,0).getDate(); d++) {
                const k = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                const h = globalDailyPLMap.hasOwnProperty(k), p = h ? globalDailyPLMap[k] : 0;
                let c = 'cal-cell'; if(h) c += p>=0 ? ' green' : ' red'; else c += ' empty';
                let con = `<div class="day">${d}</div>`;
                if(h) con += `<div class="amount-wrap"><span class="currency">$</span><span class="number">${p>0?'+':''}${p.toFixed(0)}</span></div>`;
                else con += `<div class="amount-wrap"><span class="empty-sign">—</span></div>`;
                html += `<div class="${c}">${con}</div>`;
            }
            document.getElementById('calendarGridContainer').innerHTML = html + `</div>`;
        }

        function changeMonth(s) {
            if(Object.keys(globalDailyPLMap).length === 0) return;
            currentCalendarDate = new Date(currentCalendarDate.getFullYear(), currentCalendarDate.getMonth() + s, 1);
            renderCalendar(currentCalendarDate);
        }
        window.addEventListener('resize', ()=>myChart.resize());
    </script>
</body>
</html>
